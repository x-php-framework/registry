name: composer-publish-registry

on:
  push:
    branches:
      - main
    paths:
      - 'satis.json'
      - '.github/workflows/publish.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create package access token
        id: package-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: x-php-framework
          permission-contents: read

      - name: Install Satis
        run: composer create-project --no-interaction --stability=dev composer/satis satis

      - name: Authenticate private repositories
        env:
          PACKAGE_READ_TOKEN: ${{ steps.package-token.outputs.token }}
        run: git config --global url."https://x-access-token:${PACKAGE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Build registry
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ steps.package-token.outputs.token }}"}}'
        run: php satis/bin/satis build -n satis.json public/

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/registry
          cp -a public/. /tmp/registry/

          cd /tmp/registry
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish Composer registry"

          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
